
# ============================================================
#  crypto-ticker network policies
#  Model: deny everything by default, then open only the
#         exact connections each app needs.
# ============================================================
 
 
# ---- 1. Default deny -----------------------------------------
# Blocks ALL traffic (in and out) for every pod in the namespace.
# Everything below this line re-opens specific paths.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: crypto-ticker
spec:
  podSelector: {}            # {} = every pod
  policyTypes:
    - Ingress
    - Egress
 
 
# ---- 2. Allow DNS --------------------------------------------
# Every pod needs DNS to resolve names like "redis" or
# "stream.binance.com". Without this, nothing can connect.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: crypto-ticker
spec:
  podSelector: {}            # applies to every pod
  policyTypes:
    - Egress
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
 
 
# ---- 3. Redis (Valkey) ---------------------------------------
# Who may CONNECT TO Redis on 6379:
#   crypto-api, fetcher, collector.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: crypto-ticker
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: { matchLabels: { app: crypto-api } }
        - podSelector: { matchLabels: { app: fetcher } }
        - podSelector: { matchLabels: { app: collector } }
      ports:
        - { port: 6379 }
 
 
# ---- 4. Fetcher ----------------------------------------------
# What the fetcher may REACH OUT TO:
#   Redis (6379) + the internet on 443 (CoinGecko).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fetcher-policy
  namespace: crypto-ticker
spec:
  podSelector:
    matchLabels:
      app: fetcher
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector: { matchLabels: { app: redis } }
      ports:
        - { port: 6379 }
    - ports:
        - { port: 443, protocol: TCP }        # CoinGecko (HTTPS)
 
 
# ---- 5. API --------------------------------------------------
# Ingress: anyone may reach it on 8000 (the ingress does).
# Egress:  it may reach Redis on 6379.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-policy
  namespace: crypto-ticker
spec:
  podSelector:
    matchLabels:
      app: crypto-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - { port: 8000 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: redis } }
      ports:
        - { port: 6379 }
 
 
# ---- 6. Collector --------------------------------------------
# What the collector may REACH OUT TO:
#   Redis (6379), ClickHouse (8123),
#   and the internet on 443 (Binance WebSocket) —
#   but NOT other pods inside the cluster on 443.
# Ingress: none. Nothing needs to connect to it.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collector-policy
  namespace: crypto-ticker
spec:
  podSelector:
    matchLabels:
      app: collector
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector: { matchLabels: { app: redis } }
      ports:
        - { port: 6379 }
    - to:
        - podSelector: { matchLabels: { app: clickhouse } }
      ports:
        - { port: 8123 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0                    # the internet...
      ports:
        - { port: 443, protocol: TCP }         # Binance (HTTPS/WSS)
        - { port: 9443, protocol: TCP }
 
 
# ---- 7. ClickHouse -------------------------------------------
# Who may CONNECT TO ClickHouse on 8123:
#   the collector only.
# Egress: none (DNS is covered by policy 2). A database
#   has no reason to make outbound calls.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-policy
  namespace: crypto-ticker
spec:
  podSelector:
    matchLabels:
      app: clickhouse
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: { matchLabels: { app: collector } }
      ports:
        - { port: 8123 }
 

