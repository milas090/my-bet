apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetcher
  namespace: crypto-ticker
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 2
      template:
        metadata: 
          labels:
            app: fetcher
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: fetcher
              image: crypto-fetcher:v1
              imagePullPolicy: Never
              envFrom:
                - configMapRef:
                    name: fetcher-config
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: redis-secret
                      key: password
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 128Mi
                  cpu: 100m
